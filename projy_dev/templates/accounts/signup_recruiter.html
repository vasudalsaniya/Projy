{% extends 'base.html' %}

{% block title %}Recruiter Registration | Projy{% endblock %}

{% block content %}
<style>
    .auth-container { max-width: 550px; margin: 40px auto 80px auto; padding: 0 20px; }
    .glass-card { background: var(--surface-glass); border: 1px solid var(--border-glass); border-radius: 12px; padding: 40px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    
    .auth-title { text-align: center; color: var(--neon-purple); font-size: 2rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.5px; }
    
    /* Target Django's form.as_p output seamlessly */
    #django-form-wrapper p { margin-bottom: 20px; }
    #django-form-wrapper label { display: block; color: var(--text-main); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    
    #django-form-wrapper input[type="text"],
    #django-form-wrapper input[type="email"],
    #django-form-wrapper input[type="password"],
    #django-form-wrapper input[type="file"],
    #django-form-wrapper select {
        width: 100%; background: var(--input-bg); border: 1px solid var(--border-glass); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; font-family: inherit; outline: none; transition: all 0.3s ease;
    }
    
    #django-form-wrapper input:focus, #django-form-wrapper select:focus { border-color: var(--neon-purple); box-shadow: 0 0 12px rgba(176, 38, 255, 0.2); }
    #django-form-wrapper select option { background: var(--surface-heavy); color: var(--text-main); }
    
    .helptext { display: block; color: var(--text-muted); font-size: 0.75rem; margin-top: 6px; }
    .errorlist { color: #ff4d4f; list-style: none; padding: 0; font-size: 0.8rem; margin-top: 5px; margin-bottom: 10px; }

    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--neon-purple) 0%, #faad14 100%); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 15px; box-shadow: 0 4px 15px rgba(176, 38, 255, 0.3); }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(176, 38, 255, 0.5); }
</style>

<div class="auth-container">
    <div class="glass-card">
        <h2 class="auth-title">Company Registration</h2>
        <p style="text-align: center; color: var(--text-muted); margin-top: 0; margin-bottom: 25px; font-size: 0.9rem;">Create an account to hire talent.</p>
        
        <hr style="border: 0; border-top: 1px solid var(--border-glass); margin-bottom: 25px;">
        
        <form method="post" enctype="multipart/form-data" id="django-form-wrapper">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit">Register Company Account</button>
        </form>
        
        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--neon-purple); text-decoration: none; font-weight: 600;">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
