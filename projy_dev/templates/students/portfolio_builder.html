{% extends 'base.html' %}
{% block title %}Portfolio Builder{% endblock %}

{% block content %}
<style>
    /* Theme Selector Styles */
    .theme-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 15px;
    }
    .theme-card {
        border: 2px solid var(--border); border-radius: 12px; padding: 15px; text-align: center;
        cursor: pointer; transition: all 0.2s; background: var(--surface);
    }
    .theme-card:hover { border-color: var(--primary); transform: translateY(-3px); }
    .theme-card.selected { border-color: var(--primary); background: rgba(79, 70, 229, 0.1); box-shadow: 0 0 0 2px var(--primary); }
    
    .theme-preview { height: 100px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--border); }
    .preview-modern { background: linear-gradient(135deg, #1e293b 0%, #4f46e5 100%); }
    .preview-minimal { background: #f8fafc; border: 1px solid #ccc; }
    .preview-hacker { background: #000; border: 1px solid #0f0; }

    /* Hide the actual radio buttons */
    .theme-radio { display: none; }
</style>

<div class="container" style="max-width: 900px; margin: 40px auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0; color: var(--text-main);">Portfolio Builder</h1>
        <a href="{% url 'live_portfolio' %}" target="_blank" class="btn" style="background: var(--surface); color: var(--primary); border: 1px solid var(--primary);">👀 View Live Site</a>
    </div>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            
            <h3 style="margin-top: 0;">1. Your Content</h3>
            <p class="text-muted" style="font-size: 0.9rem;">Fill in the details you want recruiters to see.</p>
            
            <div class="form-group">
                <label>Professional Bio</label>
                <textarea name="bio" class="form-control" rows="4" placeholder="I am a passionate developer...">{{ profile.bio|default:"" }}</textarea>
            </div>
            
            <div class="form-group">
                <label>Education Details</label>
                <input type="text" name="education_details" class="form-control" value="{{ profile.education_details|default:"" }}" placeholder="e.g. B.Tech in Computer Science">
            </div>

            <div class="form-group">
                <label>Top Skills (Comma Separated)</label>
                <input type="text" name="skills_csv" class="form-control" value="{{ profile.skills_csv|default:"" }}" placeholder="Python, Django, React, SQL">
            </div>

            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Job Title / Headline</label>
                    <input type="text" name="job_title" class="form-control" value="{{ profile.job_title|default:'' }}" placeholder="Software Developer">
                </div>
                <div style="flex: 1;">
                    <label>Birthday</label>
                    <input type="date" name="birthday" class="form-control" value="{{ profile.birthday|date:'Y-m-d' }}">
                </div>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" class="form-control" value="{{ profile.location|default:'' }}" placeholder="Gandhinagar, Gujarat, India">
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 30px 0;">

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 30px 0;">

            <h3>2. Choose a Theme</h3>
            <div class="theme-grid">
                
                <label class="theme-card {% if profile.portfolio_theme == 'modern' %}selected{% endif %}" onclick="selectTheme(this)">
                    <input type="radio" name="portfolio_theme" value="modern" class="theme-radio" {% if profile.portfolio_theme == 'modern' %}checked{% endif %}>
                    <div class="theme-preview preview-modern"></div>
                    <strong>Modern Business</strong>
                </label>

                <label class="theme-card {% if profile.portfolio_theme == 'minimal' %}selected{% endif %}" onclick="selectTheme(this)">
                    <input type="radio" name="portfolio_theme" value="minimal" class="theme-radio" {% if profile.portfolio_theme == 'minimal' %}checked{% endif %}>
                    <div class="theme-preview preview-minimal"></div>
                    <strong style="color: #6c6c6c;">Clean Minimalist</strong>
                </label>

                <label class="theme-card {% if profile.portfolio_theme == 'hacker' %}selected{% endif %}" onclick="selectTheme(this)">
                    <input type="radio" name="portfolio_theme" value="hacker" class="theme-radio" {% if profile.portfolio_theme == 'hacker' %}checked{% endif %}>
                    <div class="theme-preview preview-hacker"></div>
                    <strong style="color: #0f0;">Terminal Coder</strong>
                </label>

            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 30px; font-size: 1.1rem; padding: 15px;">Generate Portfolio</button>
        </form>
    </div>
</div>

<script>
    function selectTheme(element) {
        // Remove selected class from all
        document.querySelectorAll('.theme-card').forEach(card => card.classList.remove('selected'));
        // Add to clicked
        element.classList.add('selected');
    }
</script>
{% endblock %}
