{% extends 'base.html' %}

{% block title %}Sign In | CSquare{% endblock %}

{% block content %}
<style>
    .auth-container { max-width: 450px; margin: 80px auto; padding: 0 20px; }
    .glass-card { background: var(--surface-glass); border: 1px solid var(--border-glass); border-radius: 12px; padding: 40px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    
    .auth-title { text-align: center; color: var(--text-main); font-size: 2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.5px; }

    /* Force Django default inputs to match new theme */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-main); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .form-group input { width: 100%; background: var(--input-bg); border: 1px solid var(--border-glass); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: all 0.3s ease; }
    .form-group input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); }

    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 15px; box-shadow: 0 4px 15px rgba(176, 38, 255, 0.3); }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(176, 38, 255, 0.5); }

    /* Signup Section Styles */
    .signup-section { margin-top: 30px; text-align: center; }
    
    .divider {
        display: flex; align-items: center; text-align: center;
        color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;
    }
    .divider::before, .divider::after {
        content: ''; flex: 1; border-bottom: 1px solid var(--border-glass);
    }
    .divider:not(:empty)::before { margin-right: 1em; }
    .divider:not(:empty)::after { margin-left: 1em; }

    .signup-buttons { display: flex; gap: 15px; }
    
    .btn-outline {
        flex: 1; background: transparent; padding: 10px 15px; border-radius: 8px;
        font-size: 0.85rem; font-weight: 600; text-decoration: none;
        transition: all 0.3s ease; text-align: center;
    }
    
    .btn-cyan { border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
    .btn-cyan:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); color: var(--text-main); }
    
    .btn-purple { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
    .btn-purple:hover { background: rgba(176, 38, 255, 0.1); box-shadow: 0 0 12px rgba(176, 38, 255, 0.2); color: var(--text-main); }
</style>

<div class="auth-container">
    <div class="glass-card">
        <h2 class="auth-title">Sign In</h2>

        <form method="POST">
            {% csrf_token %} 
            <div class="form-group">
                <label>Email Address</label>
                {{ form.username }}
            </div>
            
            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="signup-section">
            <div class="divider"><span>Don't have an account?</span></div>
            <div class="signup-buttons">
                <a href="{% url 'signup_college' %}" class="btn-outline btn-cyan">Join Campus</a>
                <a href="{% url 'signup_recruiter' %}" class="btn-outline btn-purple">Hire Talent</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
