{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h2>Sign In</h2>

    <form method="POST">
        {% csrf_token %} <div class="form-group">
            <label>Email</label>
            {{ form.username }}
        </div>
        
        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn" style="width: 100%;">Login</button>
    </form>
</div>
{% endblock %}
