{% extends 'base.html' %}

{% block title %}Recruiter Registration{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2 class="text-center" style="color: var(--primary);">Company Registration</h2>
    <p class="text-center text-muted">Create an account to hire talent.</p>
    <hr>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Register Company Account</button>
    </form>
    <div class="text-center" style="margin-top: 15px;">
        <small>Already have an account? <a href="{% url 'login' %}">Login here</a></small>
    </div>
</div>
{% endblock %}
